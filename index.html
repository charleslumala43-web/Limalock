<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumalock Secure Folder</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e1e4ea;--ac:#6d4aff;--er:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1016;--card:#171a22;--tx:#eef0f5;--mu:#9aa2b2;--bd:#2a2f3b;--ac:#9b83ff;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1016;--card:#171a22;--tx:#eef0f5;--mu:#9aa2b2;--bd:#2a2f3b;--ac:#9b83ff;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
textarea{min-height:90px;resize:vertical}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit}
button.g{background:none;border:1px solid var(--bd);color:var(--tx)}
button.x{background:none;color:var(--er);padding:4px 8px}
.lock{text-align:center;padding-top:6vh}.logo{display:block;margin:0 auto 12px;background:#fff;border-radius:16px;padding:8px}.logo.big{width:min(260px,70%);height:auto}.logo.sm{height:36px;width:auto;padding:3px 6px;border-radius:8px}
.mu{color:var(--mu);font-size:13px}.er{color:var(--er);min-height:20px;font-size:13px}
.item img{max-width:100%;border-radius:8px;margin-top:8px}
.item pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:6px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btns{display:flex;gap:8px}
</style></head><body><main id="app"></main>
<script>
const E=new TextEncoder(),Dc=new TextDecoder();let key=null,salt=null,items=[],timer=null,err='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,s){const k=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function store(){try{return JSON.parse(localStorage.getItem('luma'))}catch(e){return null}}
async function save(){const iv=crypto.getRandomValues(new Uint8Array(12));
const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,E.encode(JSON.stringify(items))));
try{localStorage.setItem('luma',JSON.stringify({s:b64(salt),i:b64(iv),c:b64(ct)}));return true}catch(e){alert('Storage is full or unavailable. Delete some items.');return false}}
async function unlock(){const pw=$('pw').value,st=store();err='';
try{if(!st){if(pw.length<6){err='Use at least 6 characters.';return lockUI()}
if(pw!==$('pw2').value){err='Passcodes do not match.';return lockUI()}
salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pw,salt);items=[];await save()}
else{salt=unb(st.s);const k=await derive(pw,salt);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(st.i)},k,unb(st.c));key=k;items=JSON.parse(Dc.decode(pt))}
}catch(e){err='Wrong passcode.';return lockUI()}
vaultUI();arm()}
function lock(){key=null;items=[];clearTimeout(timer);err='';lockUI()}
function arm(){clearTimeout(timer);if(key)timer=setTimeout(lock,120000)}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>key&&arm()));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&key)lock()});

function list(){$('list').innerHTML=items.map(i=>`<div class="card item"><div class="row"><b>${i.t==='img'?'🖼️ ':'📝 '}${esc(i.name)}</b><button class="x" onclick="rm(${i.id})">Delete</button></div>
${i.t==='img'?`<img src="${i.d}" alt="">`:`<pre>${esc(i.d)}</pre>`}</div>`).join('')||'<div class="mu" style="text-align:center;padding:20px">Your folder is empty</div>'}
function changeUI(){$('app').innerHTML=`<div class="top"><h1>Change passcode</h1><button class="g" onclick="err='';vaultUI()">Cancel</button></div>
<div class="card"><input id="cp" type="password" placeholder="Current passcode" autocomplete="off">
<input id="np" type="password" placeholder="New passcode (6+ characters)" autocomplete="off">
<input id="np2" type="password" placeholder="Confirm new passcode" autocomplete="off">
<div class="er">${esc(err)}</div><button onclick="changePw()" style="width:100%">Update passcode</button>
<p class="mu">Your folder is re-encrypted with the new passcode. There is no recovery if you forget it.</p></div>`;
$('np2').addEventListener('keydown',e=>{if(e.key==='Enter')changePw()})}
async function changePw(){const cur=$('cp').value,np=$('np').value,np2=$('np2').value,st=store();err='';
try{const k=await derive(cur,unb(st.s));await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(st.i)},k,unb(st.c))}
catch(e){err='Current passcode is wrong.';return changeUI()}
if(np.length<6){err='Use at least 6 characters.';return changeUI()}
if(np!==np2){err='New passcodes do not match.';return changeUI()}
if(np===cur){err='New passcode must be different.';return changeUI()}
const oldKey=key,oldSalt=salt;
salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(np,salt);
if(!(await save())){key=oldKey;salt=oldSalt;err='Could not save. Passcode unchanged.';return changeUI()}
arm();vaultUI();alert('Passcode changed.')}
async function addNote(){const n=$('n').value.trim();if(!n)return;items.unshift({id:Date.now(),t:'note',name:$('t').value.trim()||'Untitled',d:n});await save();vaultUI()}
function addPhoto(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{
const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
c.getContext('2d').drawImage(im,0,0,c.width,c.height);items.unshift({id:Date.now(),t:'img',name:f.name,d:c.toDataURL('image/jpeg',.7)});await save();vaultUI()};im.src=r.result};r.readAsDataURL(f)}
async function rm(id){if(!confirm('Delete this item?'))return;items=items.filter(i=>i.id!==id);await save();list()}
lockUI();
</script></body></html>
